name: M2 Staged Development Evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded development evaluation mode
        required: true
        default: canary
        type: choice
        options:
          - canary
          - dev
          - release
          - research

permissions:
  contents: read

concurrency:
  group: m2-staged-eval-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: staged eval / ${{ inputs.mode }} / opencode-go
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Probe managed OpenCode Go Flash staged boundary
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: >-
          node scripts/probe-m2-opencode-go.mjs
          --model deepseek-v4-flash
          --staged-transport
          --output .artifacts/m2-staged-provider-probe.json

      - name: Validate exact managed-gateway capability receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const receipt = JSON.parse(fs.readFileSync('.artifacts/m2-staged-provider-probe.json', 'utf8'))
          const identityInvalid = receipt.provider !== 'opencode-go'
            || receipt.baseUrl !== 'https://opencode.ai/zen/go/v1'
            || receipt.requestModel !== 'deepseek-v4-flash'
            || receipt.responseModel !== 'deepseek-v4-flash'
            || receipt.thinking !== 'enabled'
            || receipt.reasoningEffort !== 'high'
            || receipt.functionToolCall !== 'verified'
            || receipt.reasoningContinuation !== 'verified'
            || receipt.tokenMeasurement !== 'verified'
            || !Number.isInteger(receipt.inputTokens)
            || receipt.inputTokens < 0
            || !Number.isInteger(receipt.outputTokens)
            || receipt.outputTokens < 0
          if (identityInvalid) throw new Error('staged evaluation requires the exact OpenCode Go / deepseek-v4-flash managed-gateway identity receipt')
          if (receipt.stagedNamedToolChoice !== 'verified') throw new Error('staged provider probe did not verify named tool_choice')
          if (receipt.stagedStrictResultSchema !== 'verified') throw new Error('staged provider probe did not verify strict result schema')
          console.log('Staged managed-gateway provider receipt and finalization transport are compatible')
          NODE

      - name: Run bounded staged evaluation
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          M2_STAGED_PROVIDER_PROBE: .artifacts/m2-staged-provider-probe.json
        run: >-
          pnpm eval:run --
          --mode ${{ inputs.mode }}
          --manifest docs/evaluation/m2/h1-dev-corpus-v1/manifest.json
          --output .artifacts/m2-staged-eval-report.json

      - name: Upload run-local staged evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-staged-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/m2-staged-provider-probe.json
            .artifacts/m2-staged-eval-report.json
          if-no-files-found: error
          retention-days: 14
