name: M2 Staged Development Evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded development evaluation mode
        required: true
        default: canary
        type: choice
        options:
          - canary
          - dev
          - release
          - research

permissions:
  contents: read

concurrency:
  group: m2-staged-eval-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: staged eval / ${{ inputs.mode }} / opencode-go
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Probe managed OpenCode Go Flash boundary
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: >-
          node scripts/probe-m2-opencode-go.mjs
          --model deepseek-v4-flash
          --output .artifacts/m2-staged-provider-probe.json

      - name: Validate exact managed-gateway capability receipt
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.artifacts/m2-staged-provider-probe.json','utf8')); const bad = r.provider !== 'opencode-go' || r.baseUrl !== 'https://opencode.ai/zen/go/v1' || r.requestModel !== 'deepseek-v4-flash' || r.responseModel !== 'deepseek-v4-flash' || r.thinking !== 'enabled' || r.reasoningEffort !== 'high' || r.functionToolCall !== 'verified' || r.reasoningContinuation !== 'verified' || r.tokenMeasurement !== 'verified' || !Number.isInteger(r.inputTokens) || r.inputTokens < 0 || !Number.isInteger(r.outputTokens) || r.outputTokens < 0; if (bad) { console.error('Staged development evaluation requires the exact OpenCode Go / deepseek-v4-flash managed-gateway capability receipt'); process.exit(1) } console.log('Staged managed-gateway provider receipt is compatible')"

      - name: Run bounded staged evaluation
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          M2_STAGED_PROVIDER_PROBE: .artifacts/m2-staged-provider-probe.json
        run: >-
          pnpm eval:run --
          --mode ${{ inputs.mode }}
          --manifest docs/evaluation/m2/h1-dev-corpus-v1/manifest.json
          --output .artifacts/m2-staged-eval-report.json

      - name: Upload run-local staged evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-staged-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/m2-staged-provider-probe.json
            .artifacts/m2-staged-eval-report.json
          if-no-files-found: error
          retention-days: 14
