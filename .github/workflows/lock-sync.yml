name: M2 lockfile sync

on:
  push:
    branches:
      - chore/m2-lock-sync
    paths:
      - .github/workflows/lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/m2-lock-sync

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Regenerate lock importer only
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Prove only pnpm-lock.yaml changed
        shell: bash
        run: |
          test "$(git status --short | awk '{print $2}' | sort -u)" = "pnpm-lock.yaml"

      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate M2 runtime lockfile"
          git push origin HEAD:chore/m2-lock-sync
