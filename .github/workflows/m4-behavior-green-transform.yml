name: M4 Behavior Green Transform

on:
  push:
    branches:
      - feat/m4-behavior-result
    paths:
      - scripts/apply-m4-behavior-green.mjs

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[m4-green]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/m4-behavior-result
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic GREEN transform
        run: node scripts/apply-m4-behavior-green.mjs

      - name: Verify generated Protocol is synchronized
        run: node scripts/generate-protocol.mjs --check

      - name: Commit transformed tree
        run: |
          rm .github/workflows/m4-behavior-green-transform.yml
          rm scripts/apply-m4-behavior-green.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(verification): implement explicit Agent Tool behavior results [m4-green]"
          git push origin HEAD:feat/m4-behavior-result
