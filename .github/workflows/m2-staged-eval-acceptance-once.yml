name: M2 Staged Transport Acceptance Once

on:
  push:
    branches:
      - fix/m2-staged-measurement-transport
    paths:
      - .github/workflows/m2-staged-eval-acceptance-once.yml

permissions:
  contents: read

concurrency:
  group: m2-staged-transport-acceptance-once
  cancel-in-progress: false

jobs:
  canary:
    name: repaired real 16-call canary / opencode-go
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Probe exact staged provider transport
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: >-
          node scripts/probe-m2-opencode-go.mjs
          --model deepseek-v4-flash
          --staged-transport
          --output .artifacts/m2-staged-provider-probe.json

      - name: Validate exact staged provider receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const receipt = JSON.parse(fs.readFileSync('.artifacts/m2-staged-provider-probe.json', 'utf8'))
          const identityInvalid = receipt.provider !== 'opencode-go'
            || receipt.baseUrl !== 'https://opencode.ai/zen/go/v1'
            || receipt.requestModel !== 'deepseek-v4-flash'
            || receipt.responseModel !== 'deepseek-v4-flash'
            || receipt.thinking !== 'enabled'
            || receipt.reasoningEffort !== 'high'
            || receipt.functionToolCall !== 'verified'
            || receipt.reasoningContinuation !== 'verified'
            || receipt.tokenMeasurement !== 'verified'
            || !Number.isInteger(receipt.inputTokens)
            || receipt.inputTokens < 0
            || !Number.isInteger(receipt.outputTokens)
            || receipt.outputTokens < 0
          if (identityInvalid) throw new Error('acceptance requires the exact OpenCode Go / deepseek-v4-flash managed-gateway identity receipt')
          if (receipt.stagedNamedToolChoice !== 'verified') throw new Error('acceptance preflight did not verify named tool_choice')
          if (receipt.stagedStrictResultSchema !== 'verified') throw new Error('acceptance preflight did not verify strict result schema')
          console.log('Acceptance preflight verified staged structured-result transport')
          NODE

      - name: Run exactly one repaired staged canary
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          M2_STAGED_PROVIDER_PROBE: .artifacts/m2-staged-provider-probe.json
        run: >-
          pnpm eval:run --
          --mode canary
          --manifest docs/evaluation/m2/h1-dev-corpus-v1/manifest.json
          --output .artifacts/m2-staged-eval-report.json

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-staged-transport-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/m2-staged-provider-probe.json
            .artifacts/m2-staged-eval-report.json
          if-no-files-found: warn
          retention-days: 7
