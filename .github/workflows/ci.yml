name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  primary:
    name: primary / ubuntu / node 24.19
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run aggregate quality gate
        run: pnpm check

      - name: Build transparent NodeNext artifacts
        run: pnpm build

      - name: Pack exact distribution artifact
        run: |
          mkdir -p .artifacts
          pnpm pack --out .artifacts/dsh-toolchain.tgz

      - name: Inspect packed tarball against its manifest
        run: node scripts/check-pack.mjs .artifacts/dsh-toolchain.tgz

      - name: Smoke built stable public API and CLI
        run: |
          node lib/frontends/cli/bin.js --version
          node lib/frontends/cli/bin.js --help > /dev/null
          node --input-type=module -e "import('./lib/index.js').then(m => { if (m.TOOLCHAIN_PRODUCT !== 'dsh-toolchain' || m.TOOLCHAIN_VERSION !== '0.0.0' || m.TOOLCHAIN_PROTOCOL_VERSION !== '1' || 'createApplicationKernel' in m) process.exit(1) })"

      - name: Smoke installed package resolution
        run: node scripts/smoke-installed-package.mjs .artifacts/dsh-toolchain.tgz

      - name: Compose exact tarball in minimal and Web DSH profiles
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/smoke-dsh-package.mjs .artifacts/dsh-toolchain.tgz

      - name: Resolve read-only targets across DSH trains
        run: node scripts/smoke-target-resolve.mjs

  m2-fixture-capture:
    name: m2.3 one-time rc2 Web fixture capture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build production acquisition modules
        run: pnpm build

      - name: Capture exact rc2 Web evaluation fixture
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          M2_FIXTURE_GENERATED_AT: '2026-08-28T00:00:00.000Z'
        run: node scripts/generate-m2-evaluation-fixture.mjs --stdout

  node-compat:
    name: node compatibility / ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22.19.0'
          - '24.19.0'
          - '26'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run aggregate quality gate
        run: pnpm check

  boundary-smoke:
    name: boundary smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build platform boundary
        run: pnpm build

      - name: Smoke built CLI and stable public API
        shell: bash
        run: |
          node lib/frontends/cli/bin.js --version
          node --input-type=module -e "import('./lib/index.js').then(m => { if (m.TOOLCHAIN_PRODUCT !== 'dsh-toolchain' || 'createApplicationKernel' in m) process.exit(1) })"
