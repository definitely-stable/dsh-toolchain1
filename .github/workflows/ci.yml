name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  primary:
    name: primary / ubuntu / node 24.19
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run aggregate quality gate
        run: pnpm check

      - name: Build transparent NodeNext artifacts
        run: pnpm build

      - name: Pack exact distribution artifact
        run: |
          mkdir -p .artifacts
          pnpm pack --out .artifacts/dsh-toolchain.tgz

      - name: Inspect packed tarball against its manifest
        run: node scripts/check-pack.mjs .artifacts/dsh-toolchain.tgz

      - name: Smoke built public API and CLI
        run: |
          node lib/frontends/cli/bin.js --version
          node lib/frontends/cli/bin.js --help > /dev/null
          node --input-type=module -e "import('./lib/index.js').then(m => { const d = m.createApplicationKernel().describe(); if (d.product !== 'dsh-toolchain' || d.version !== '0.0.0') process.exit(1) })"

      - name: Smoke installed package resolution
        run: node scripts/smoke-installed-package.mjs .artifacts/dsh-toolchain.tgz

      - name: Compose exact tarball in clean DSH profile
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/smoke-dsh-package.mjs .artifacts/dsh-toolchain.tgz

  node-compat:
    name: node compatibility / ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22.19.0'
          - '24.19.0'
          - '26'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run aggregate quality gate
        run: pnpm check

  boundary-smoke:
    name: boundary smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build platform boundary
        run: pnpm build

      - name: Smoke built CLI and public API
        shell: bash
        run: |
          node lib/frontends/cli/bin.js --version
          node --input-type=module -e "import('./lib/index.js').then(m => { const d = m.createApplicationKernel().describe(); if (d.product !== 'dsh-toolchain') process.exit(1) })"
