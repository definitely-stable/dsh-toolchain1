name: M2 H1 Execution

on:
  workflow_dispatch:
    inputs:
      max_committed_attempts:
        description: Maximum durable attempts to commit in this chunk
        required: true
        default: '24'
        type: choice
        options:
          - '12'
          - '24'
          - '48'

permissions:
  contents: read

concurrency:
  group: m2-h1-execution-main
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      H1_EXPECTED_MODEL: deepseek-v4-flash
    steps:
      - name: Require main ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo '::error::M2 H1 execution is allowed only from refs/heads/main'
            exit 1
          fi

      - name: Initialize private runner paths
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            echo "H1_DATASET=$RUNNER_TEMP/m2-h1-private-dataset.json"
            echo "H1_RUN_STORE=$RUNNER_TEMP/m2-h1-run-store"
            echo "H1_STATE_ARCHIVE=$RUNNER_TEMP/h1-run-store.tar"
            echo "H1_STATE_ENCRYPTED=$RUNNER_TEMP/h1-run-store.enc"
            echo "H1_SOURCE_BOUND_PREREGISTRATION=$RUNNER_TEMP/h1-source-bound-preregistration-v2.json"
          } >> "$GITHUB_ENV"

      - name: Checkout publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          install: false

      - name: Set up Node 24.19
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Resolve bound H1 execution source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PUBLICATION='docs/evaluation/m2/h1-source-bound-preregistration-v2.json'
          if [[ ! -f "$SOURCE_PUBLICATION" ]]; then
            echo '::error::Missing published H1 source-bound preregistration envelope'
            exit 1
          fi
          cp "$SOURCE_PUBLICATION" "$H1_SOURCE_BOUND_PREREGISTRATION"
          H1_BOUND_SOURCE_COMMIT="$(node -e '
            const fs = require("node:fs")
            const envelope = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
            const identity = JSON.parse(envelope.sourceBinding.sourceIdentity.inline)
            if (!/^[0-9a-f]{40}$/.test(identity.sourceCommitSha)) process.exit(2)
            process.stdout.write(identity.sourceCommitSha)
          ' "$H1_SOURCE_BOUND_PREREGISTRATION")"
          echo "H1_BOUND_SOURCE_COMMIT=$H1_BOUND_SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Checkout exact bound H1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
          ref: ${{ env.H1_BOUND_SOURCE_COMMIT }}

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore encrypted H1 run state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/h1-run-store.enc
          key: m2-h1-dc12ccf9-${{ github.run_id }}
          restore-keys: |
            m2-h1-dc12ccf9-

      - name: Materialize private H1 inputs
        shell: bash
        env:
          H1_DATASET_SECRET: ${{ secrets.M2_H1_DATASET_GZIP_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${H1_DATASET_SECRET:-}" ]]; then
            echo '::error::Missing required secret M2_H1_DATASET_GZIP_BASE64'
            exit 1
          fi
          printf '%s' "$H1_DATASET_SECRET" | base64 --decode | gzip --decompress > "$H1_DATASET"
          echo 'c007472514fa6fd1daa06cffb94f4052062a03bdceba475773830e73a01e32e6  '"$H1_DATASET" | sha256sum --check --status
          H1_STATE_KEY="$(printf '%s' "$H1_DATASET_SECRET" | sha256sum | cut -d' ' -f1)"
          if [[ -f "$H1_STATE_ENCRYPTED" ]]; then
            export H1_STATE_KEY
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:H1_STATE_KEY -in "$H1_STATE_ENCRYPTED" -out "$H1_STATE_ARCHIVE"
            mkdir -p "$H1_RUN_STORE"
            tar -xf "$H1_STATE_ARCHIVE" -C "$H1_RUN_STORE"
            rm -f "$H1_STATE_ARCHIVE"
          else
            mkdir -p "$H1_RUN_STORE"
          fi

      - name: Preflight exact preregistered H1 binding
        shell: bash
        run: |
          set -euo pipefail
          pnpm m2:h1:run \
            --dataset "$H1_DATASET" \
            --run-store "$H1_RUN_STORE" \
            --source-bound-preregistration "$H1_SOURCE_BOUND_PREREGISTRATION"

      - name: Execute bounded H1 chunk
        id: execute
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
            echo '::error::Missing required secret OPENCODE_API_KEY'
            exit 1
          fi
          pnpm m2:h1:run \
            --dataset "$H1_DATASET" \
            --run-store "$H1_RUN_STORE" \
            --source-bound-preregistration "$H1_SOURCE_BOUND_PREREGISTRATION" \
            --execute \
            --max-committed-attempts "${{ inputs.max_committed_attempts }}"

      - name: Encrypt resumable H1 run state
        if: always()
        shell: bash
        env:
          H1_DATASET_SECRET: ${{ secrets.M2_H1_DATASET_GZIP_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -d "$H1_RUN_STORE" && -n "${H1_DATASET_SECRET:-}" ]]; then
            tar -cf "$H1_STATE_ARCHIVE" -C "$H1_RUN_STORE" .
            H1_STATE_KEY="$(printf '%s' "$H1_DATASET_SECRET" | sha256sum | cut -d' ' -f1)"
            export H1_STATE_KEY
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:H1_STATE_KEY -in "$H1_STATE_ARCHIVE" -out "$H1_STATE_ENCRYPTED"
            rm -f "$H1_STATE_ARCHIVE"
          fi

      - name: Save encrypted H1 run state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/h1-run-store.enc
          key: m2-h1-dc12ccf9-${{ github.run_id }}
