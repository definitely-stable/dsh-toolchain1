name: Performance Validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded deterministic performance profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - benchmark
          - stress
  schedule:
    - cron: '23 2 * * 1-6'
    - cron: '41 3 * * 0'

permissions:
  contents: read

concurrency:
  group: performance-validation-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile || github.event.schedule || 'smoke' }}
  cancel-in-progress: true

jobs:
  measure:
    name: performance / ${{ github.event_name == 'pull_request' && 'smoke' || github.event_name == 'workflow_dispatch' && inputs.profile || github.event.schedule == '41 3 * * 0' && 'stress' || 'benchmark' }} / node 24.19
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PERF_PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || github.event_name == 'workflow_dispatch' && inputs.profile || github.event.schedule == '41 3 * * 0' && 'stress' || 'benchmark' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build transparent NodeNext artifacts
        run: pnpm build

      - name: Run bounded performance profile
        run: node scripts/perf/run.mjs --profile "$PERF_PROFILE" --output-dir .artifacts/perf

      - name: Publish performance summary
        if: always() && hashFiles('.artifacts/perf/summary.md') != ''
        run: cat .artifacts/perf/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run-local performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/perf/environment.json
            .artifacts/perf/samples.jsonl
            .artifacts/perf/summary.json
            .artifacts/perf/summary.md
          if-no-files-found: warn
          retention-days: 14
