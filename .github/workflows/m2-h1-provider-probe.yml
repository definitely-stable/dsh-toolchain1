name: M2 H1 Provider Identity Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-h1-provider-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-h1-provider-identity
  cancel-in-progress: false

jobs:
  probe:
    name: provider identity / opencode-go / ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        model:
          - deepseek-v4-pro
          - deepseek-v4-flash
          - glm-5.3-flash
          - glm-5.3
          - glm-5.2
          - glm-5.1
          - kimi-k3
          - kimi-k2.7-code
          - kimi-k2.6
          - longcat-2.0
          - mimo-v2.5
          - mimo-v2.5-pro
          - hy4-preview
          - hy3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Probe provider identity only
        id: probe
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: >-
          node scripts/probe-m2-opencode-go.mjs
          --model "${{ matrix.model }}"
          --output ".artifacts/candidate-${{ matrix.model }}.json"

      - name: Upload successful provider candidate receipt
        if: steps.probe.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-h1-provider-candidate-${{ matrix.model }}
          path: .artifacts/candidate-${{ matrix.model }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Report candidate probe outcome
        if: always()
        run: echo "candidate=${{ matrix.model }} outcome=${{ steps.probe.outcome }}"
