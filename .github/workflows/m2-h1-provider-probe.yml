name: M2 H1 Provider Identity Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-h1-provider-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-h1-provider-identity
  cancel-in-progress: false

jobs:
  probe:
    name: provider identity / opencode-go / deepseek-v4-flash
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Probe managed OpenCode Go Flash boundary only
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: >-
          node scripts/probe-m2-opencode-go.mjs
          --model deepseek-v4-flash
          --output .artifacts/m2-h1-provider-identity.json

      - name: Validate exact managed-gateway capability receipt
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.artifacts/m2-h1-provider-identity.json','utf8')); const bad = r.provider !== 'opencode-go' || r.baseUrl !== 'https://opencode.ai/zen/go/v1' || r.requestModel !== 'deepseek-v4-flash' || r.responseModel !== 'deepseek-v4-flash' || r.thinking !== 'enabled' || r.reasoningEffort !== 'high' || r.functionToolCall !== 'verified' || r.reasoningContinuation !== 'verified' || r.tokenMeasurement !== 'verified' || !Number.isInteger(r.inputTokens) || r.inputTokens < 0 || !Number.isInteger(r.outputTokens) || r.outputTokens < 0; if (bad) { console.error('H1 requires the exact OpenCode Go / deepseek-v4-flash managed-gateway capability receipt'); process.exit(1) } console.log('H1 managed-gateway provider receipt is preregistration-compatible')"

      - name: Upload provider identity receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-h1-provider-identity
          path: .artifacts/m2-h1-provider-identity.json
          if-no-files-found: error
          retention-days: 1
