name: M2 H1 Provider Identity Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-h1-provider-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-h1-provider-identity
  cancel-in-progress: false

jobs:
  probe:
    name: provider identity / opencode-go
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Probe provider identity only
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: node scripts/probe-m2-opencode-go.mjs --output .artifacts/m2-h1-provider-identity.json

      - name: Upload provider identity receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-h1-provider-identity
          path: .artifacts/m2-h1-provider-identity.json
          if-no-files-found: error
          retention-days: 1

      - name: Require strong backend identity
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.artifacts/m2-h1-provider-identity.json','utf8')); if (r.backendIdentityStrength !== 'system-fingerprint' || typeof r.systemFingerprint !== 'string' || r.systemFingerprint.length === 0) { console.error('H1 requires backendIdentityStrength=system-fingerprint with a non-empty systemFingerprint'); process.exit(1) } console.log('H1 provider identity is strong and preregistration-compatible')"
