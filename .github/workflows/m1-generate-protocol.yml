name: M1 Protocol Projection Bootstrap

on:
  push:
    branches:
      - m1/target-intelligence
    paths:
      - .github/workflows/m1-generate-protocol.yml
      - spec/schemas/v1/toolchain-protocol.schema.json
      - scripts/generate-protocol.mjs

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: m1/target-intelligence

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate canonical projection
        run: pnpm generate

      - name: Commit generated file when changed
        run: |
          if git diff --quiet -- src/protocol/generated.ts; then
            echo "Generated projection already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocol/generated.ts
          git diff --cached --check
          git commit -m "chore(protocol): regenerate target projection"
          git push origin HEAD:m1/target-intelligence
