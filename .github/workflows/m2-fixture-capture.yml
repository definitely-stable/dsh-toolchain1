name: M2.3 fixture capture

on:
  pull_request:
    paths:
      - '.github/workflows/m2-fixture-capture.yml'
      - 'scripts/generate-m2-evaluation-fixture.mjs'
      - 'src/acquisition/**'
      - 'src/model/**'
      - 'src/kernel/**'
      - 'pnpm-lock.yaml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: m2-fixture-capture-${{ github.sha }}
  cancel-in-progress: false

jobs:
  capture:
    name: exact rc2 Web registry-artifact receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install frozen Toolchain dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build production acquisition modules
        run: pnpm build

      - name: Capture exact rc2 Web evaluation fixture
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          M2_FIXTURE_GENERATED_AT: '2026-08-28T00:00:00.000Z'
        run: node scripts/generate-m2-evaluation-fixture.mjs --output=.artifacts/m2-fixture

      - name: Upload exact rc2 Web evaluation fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-rc2-web-fixture-${{ github.sha }}
          path: .artifacts/m2-fixture/*.json
          if-no-files-found: error
          retention-days: 1
