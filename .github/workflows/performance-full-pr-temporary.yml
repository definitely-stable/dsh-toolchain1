name: Performance Full PR Temporary

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: performance-full-pr-temporary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        profile:
          - benchmark
          - stress
    name: performance-full / ${{ matrix.profile }} / node 24.19
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build transparent NodeNext artifacts
        run: pnpm build

      - name: Run bounded full profile
        run: node scripts/perf/run.mjs --profile "${{ matrix.profile }}" --output-dir ".artifacts/perf-${{ matrix.profile }}"

      - name: Publish performance summary
        if: always() && hashFiles(format('.artifacts/perf-{0}/summary.md', matrix.profile)) != ''
        run: cat ".artifacts/perf-${{ matrix.profile }}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run-local performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-full-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/perf-${{ matrix.profile }}/environment.json
            .artifacts/perf-${{ matrix.profile }}/samples.jsonl
            .artifacts/perf-${{ matrix.profile }}/summary.json
            .artifacts/perf-${{ matrix.profile }}/summary.md
          if-no-files-found: error
          retention-days: 7
