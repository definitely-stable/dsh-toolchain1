name: Bootstrap generated protocol

on:
  push:
    branches:
      - m0/foundation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate protocol projection
        run: pnpm generate

      - name: Commit generated projection when changed
        shell: bash
        run: |
          if git diff --quiet -- src/protocol/generated.ts && git ls-files --error-unmatch src/protocol/generated.ts >/dev/null 2>&1; then
            echo 'Generated protocol projection is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/protocol/generated.ts
          git commit -m 'build(protocol): generate Protocol v1 types'
          git push origin HEAD:m0/foundation
