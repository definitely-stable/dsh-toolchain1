version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Riga
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@deepseek-ai/cordis"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@modelcontextprotocol/server"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Riga
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
